# Lint and the test suite, on every push and pull request that changes code. The tests run the sandbox for
# real (bwrap, prlimit), so the runner needs those tools, and Ubuntu 24.04 blocks unprivileged user namespaces
# unless AppArmor's restriction is switched off. No secrets are used: the tests fake GitHub, Jira and Claude.
#
# A push touching only the files below skips CI: nothing here is read by the tests or run by this job
# (it builds no Docker image and uses no Makefile). A push that also changes anything else runs it.
# If a file in this list starts being tested or run here, take it out.
name: CI

on:
  push:
    paths-ignore: &docs
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".env.example"
      - ".gitignore"
      - ".dockerignore"
      - ".claudeignore"
      - "Dockerfile"
      - "docker-compose.yml"
      - "deploy/**"
      - "Makefile"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install bubblewrap, git and util-linux (prlimit)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap git util-linux
      - name: Allow bubblewrap's user namespaces (Ubuntu 24.04 blocks them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check
      - name: Test
        run: uv run python -m unittest

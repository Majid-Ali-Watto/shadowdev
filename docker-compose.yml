# ShadowDev in Docker: the same on Linux, macOS and Windows. `make docker-up` builds and starts it;
# deploy/README.md, Docker, explains each setting below.
services:
  shadowdev:
    build:
      context: .
      args:  # the host user's, so data/ stays theirs (make docker-up passes them)
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: shadowdev
    restart: unless-stopped
    init: false  # the image's own tini is PID 1
    ports:
      - "127.0.0.1:8080:8080"  # this machine only; put a proxy with https in front to publish it
    volumes:
      # Mounted as a file, never as env_file: secrets stay out of the process environment (CLAUDE.md, Rules).
      - ./.env:/app/.env:ro
      - ./data:/app/data  # the token database, per-developer Claude config, logs and backups
      - worktrees:/app/worktrees  # live run workspaces: a volume, fast on macOS and Windows too
      - npm-cache:/home/shadowdev/.npm  # package caches the projects' setup commands fill
      - cache:/home/shadowdev/.cache
    # What bwrap needs to build each run's sandbox inside the container (user namespaces, and a /proc
    # of its own). The container itself has no capabilities and can't gain any, and runs as a user.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Runs in progress get up to 15 minutes to finish when it is stopped (server.DRAIN_SECONDS).
    stop_grace_period: 16m

volumes:
  worktrees:
  npm-cache:
  cache:
